<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | CloudResume Pro</title>

    <link rel="stylesheet" href="login.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

    <div class="container">

        <!-- Left Side -->

        <div class="left">

            <h1>Welcome Back!</h1>

            <p>
                Continue building professional resumes with
                <strong>CloudResume Pro</strong>.
            </p>

            <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Resume Illustration">

        </div>

        <!-- Right Side -->
        <div class="logo">
    <a href="index.html">CloudResume Pro</a>
</div>
        <div class="right">

            <div class="login-box">

                <h2>Login</h2>

                <p>Sign in to continue</p>

                <form id="loginForm">

                    <div class="input-box">

                        <i class="fa-solid fa-envelope"></i>

                        <input
                         type="email"
                         id="email"
                         placeholder="Email Address"
                        required>
                             </div>

                    <div class="input-box">

                        <i class="fa-solid fa-lock"></i>

                        <input
                        type="password"
                        id="password"
                        placeholder="Password"
                        required>

                    </div>

                    <div class="options">

                        <label>

                            <input type="checkbox">

                            Remember Me

                        </label>

                        <a href="#">Forgot Password?</a>

                    </div>

                    <button type="submit" class="login-btn">
                         Login
                    </button>

                </form>
                <p id="message"></p>

                <div class="divider">

                    <span>OR</span>

                </div>

                <button class="google">

                    <i class="fab fa-google"></i>

                    Continue with Google

                </button>

                <button class="github">

                    <i class="fab fa-github"></i>

                    Continue with GitHub

                </button>

                <p class="register">

                    Don't have an account?

                    <a href="register.html">Register</a>

                </p>

            </div>

        </div>

    </div>
    
    <script src="js/auth.js"></script>

</body>

</html>
